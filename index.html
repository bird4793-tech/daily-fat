            <div class="flex justify-end gap-2 font-mono">

            { id: 64, name: "敷臉太浪費醬汁小黃瓜", price: 45, category: "sauce", desc: "爽脆解膩第一名，拿來吃比拿來敷臉更讚。", tag: "解膩" },
            { id: 65, name: "美人腿誘惑醬汁筊白筍", price: 50, category: "sauce", desc: "鮮嫩多汁，吃了腿不知道會不會變美。", tag: "鮮嫩" },
            { id: 66, name: "假裝在喝蔬果汁醬汁西洋芹", price: 40, category: "sauce", desc: "超清爽纖維質，吃完這份可以多點一塊雞排。", tag: "清纖維" }
        ];

        let cart = [];
        let currentCategory = 'all';
        let gasWebhookUrl = localStorage.getItem('gas_webhook_url') || '';

        window.onload = function() {
            renderMenu(menuItems);
            updateCartUI();
            if(gasWebhookUrl) { document.getElementById('gasUrlInput').value = gasWebhookUrl; }
        };

        // 渲染菜單：每張卡片直接內嵌口味與配料勾選區
        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            document.getElementById('itemCountDisplay').innerText = `顯示中 ${items.length} 道品項`;
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-12 font-mono text-zine-muted">找不到符合條件的美味炸物...</div>`;
                return;
            }
            grid.innerHTML = items.map(item => `
                <div class="zine-border bg-white p-4 flex flex-col justify-between zine-shadow-sm">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-mono text-xs font-bold bg-zine-paper px-2 py-0.5 zine-border">#${item.id < 10 ? '0' + item.id : item.id}</span>
                            <span class="stamp !text-[10px] !py-0 !px-1">${item.tag}</span>
                        </div>
                        <h3 class="font-black text-base mb-1">${item.name}</h3>
                        <p class="text-xs text-zine-muted mb-3">${item.desc}</p>
                    </div>

                    <!-- 內嵌客製化選項區 -->
                    <div class="bg-zine-paper/60 zine-border p-2.5 space-y-2 mb-3 text-xs font-mono">
                        <div>
                            <span class="font-bold block mb-1">口味：</span>
                            <div class="grid grid-cols-2 gap-1">
                                <label class="cursor-pointer flex items-center gap-1"><input type="radio" name="flavor-${item.id}" value="胡椒、甘梅" checked class="accent-zine-accent"> 甘梅</label>
                                <label class="cursor-pointer flex items-center gap-1"><input type="radio" name="flavor-${item.id}" value="胡椒、原味" class="accent-zine-accent"> 原味</label>
                                <label class="cursor-pointer flex items-center gap-1"><input type="radio" name="flavor-${item.id}" value="胡椒、辣味" class="accent-zine-accent"> 辣味</label>
                                <label class="cursor-pointer flex items-center gap-1"><input type="radio" name="flavor-${item.id}" value="獨門醬燒" class="accent-zine-accent"> 醬燒</label>
                            </div>
                        </div>
                        <div>
                            <span class="font-bold block mb-1">配料：</span>
                            <div class="grid grid-cols-2 gap-1">
                                <label class="cursor-pointer flex items-center gap-1"><input type="checkbox" id="spicy-${item.id}" value="加辣" class="accent-zine-accent"> 辣</label>
                                <label class="cursor-pointer flex items-center gap-1"><input type="checkbox" id="garlic-${item.id}" value="加蒜" class="accent-zine-accent"> 蒜</label>
                                <label class="cursor-pointer flex items-center gap-1"><input type="checkbox" id="green-${item.id}" value="加蔥" class="accent-zine-accent"> 蔥</label>
                                <label class="cursor-pointer flex items-center gap-1"><input type="checkbox" id="basil-${item.id}" value="加九層塔" checked class="accent-zine-accent"> 九層塔</label>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-dashed border-zinc-200">
                        <span class="font-mono font-black text-zine-accent text-lg">$${item.price} <span class="text-xs text-zine-dark font-normal">NTD</span></span>
                        <button onclick="addToCartDirect(${item.id})" class="zine-border px-3 py-1 bg-zine-paper hover:bg-zine-dark hover:text-zine-paper font-mono text-xs font-bold cursor-pointer transition-all">
                            + 加入傳票
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-zine-dark', 'text-zine-paper');
                btn.classList.add('bg-white');
            });
            event.target.classList.remove('bg-white');
            event.target.classList.add('bg-zine-dark', 'text-zine-paper');
            filterMenu();
        }

        function filterMenu() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = menuItems.filter(item => {
                const matchCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchKeyword = item.name.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword) || item.id.toString() === keyword;
                return matchCategory && matchKeyword;
            });
            renderMenu(filtered);
        }

        // 直接從卡片內讀取客製化選項並加入購物車
        function addToCartDirect(id) {
            const item = menuItems.find(i => i.id === id);
            if(!item) return;

            const flavorEl = document.querySelector(`input[name="flavor-${id}"]:checked`);
            const flavor = flavorEl ? flavorEl.value : '胡椒、甘梅';

            const extras = [];
            if(document.getElementById(`spicy-${id}`).checked) extras.push('加辣');
            if(document.getElementById(`garlic-${id}`).checked) extras.push('加蒜');
            if(document.getElementById(`green-${id}`).checked) extras.push('加蔥');
            if(document.getElementById(`basil-${id}`).checked) extras.push('加九層塔');

            const cartKey = `${id}-${flavor}-${extras.sort().join('-')}`;
            const existing = cart.find(c => c.cartKey === cartKey);

            if(existing) {
                existing.qty++;
            } else {
                cart.push({
                    cartKey: cartKey,
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    flavor: flavor,
                    extras: extras,
                    qty: 1
                });
            }

            updateCartUI();
        }

        function changeCartQty(cartKey, delta) {
            const item = cart.find(c => c.cartKey === cartKey);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) {
                    cart = cart.filter(c => c.cartKey !== cartKey);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const listEl = document.getElementById('cartItemsList');
            const countEl = document.getElementById('cartItemCount');
            const totalEl = document.getElementById('cartTotalPrice');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            countEl.innerText = `${totalQty} 項`;
            totalEl.innerText = `$${totalPrice} NTD`;

            if(cart.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-zine-muted font-mono text-sm border-2 border-dashed border-zinc-300">目前傳票空空如也<br>趕快點一份比臉還大的雞排吧！</div>`;
                return;
            }

            listEl.innerHTML = cart.map(item => `
                <div class="zine-border bg-zine-paper p-3 flex justify-between items-center text-sm">
                    <div class="pr-2">
                        <div class="font-bold line-clamp-1">${item.name}</div>
                        <div class="font-mono text-xs text-zine-muted">口味: ${item.flavor}</div>
                        ${item.extras.length > 0 ? `<div class="font-mono text-xs text-zine-accent">配料: ${item.extras.join(', ')}</div>` : ''}
                        <div class="font-mono text-xs font-bold text-zine-accent mt-1">$${item.price} × ${item.qty} = $${item.price * item.qty}</div>
                    </div>
                    <div class="flex items-center gap-1.5 font-mono shrink-0">
                        <button onclick="changeCartQty('${item.cartKey}', -1)" class="w-6 h-6 zine-border bg-white flex items-center justify-center font-bold cursor-pointer hover:bg-zinc-200">-</button>
                        <span class="w-6 text-center font-bold text-xs">${item.qty}</span>
                        <button onclick="changeCartQty('${item.cartKey}', 1)" class="w-6 h-6 zine-border bg-white flex items-center justify-center font-bold cursor-pointer hover:bg-zinc-200">+</button>
                    </div>
                </div>
            `).join('');
        }

        function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
        function saveGasConfig() {
            gasWebhookUrl = document.getElementById('gasUrlInput').value.trim();
            localStorage.setItem('gas_webhook_url', gasWebhookUrl);
            alert('✅ 試算表 Webhook 連結已儲存成功！');
            closeConfigModal();
        }

        async function submitOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const remark = document.getElementById('orderRemark').value.trim();

            if(!name || !phone) { alert('⚠️ 請填寫取餐人姓名與聯絡電話！'); return; }
            if(cart.length === 0) { alert('⚠️ 您的傳票是空的！'); return; }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const orderDetails = cart.map(i => `${i.name} x${i.qty} (${i.flavor}${i.extras.length ? '/' + i.extras.join(',') : ''})`).join('； ');
            const orderNo = '#' + Math.floor(100 + Math.random() * 900);

            const orderData = {
                name: name,
                phone: phone,
                items: orderDetails,
                total: totalPrice,
                remark: remark || '無',
                orderNo: orderNo,
                timestamp: new Date().toLocaleString()
            };

            if(!gasWebhookUrl) {
                alert(`🎉 模擬訂單送出成功！\n\n訂單編號：${orderNo}\n姓名：${name}\n電話：${phone}\n品項：\n${orderDetails}\n總金額：$${totalPrice} NTD`);
                cart = []; updateCartUI(); return;
            }

            try {
                await fetch(gasWebhookUrl, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(orderData) 
                });
                alert(`🚀 訂單 ${orderNo} 已成功送出並同步至 Google 試算表！`);
                cart = []; updateCartUI();
            } catch (error) { alert('❌ 傳票發送失敗，請檢查網路。'); }
        }
    </script>
</body>
</html>
